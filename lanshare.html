<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN Share</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav class="navbar topbar">
  <div class="container-fluid px-4">
    <span class="navbar-brand fw-bold">LAN Share</span>
    <span class="badge text-bg-info" id="lanIp">{{lan_ip}}</span>
    <span class="ms-auto small text-secondary" id="fileCount"></span>
  </div>
</nav>

<main class="container py-4">

  <div class="dropzone card">
    <div class="card-body text-center py-4">
      <div class="dz-icon">&#128194;</div>
      <p class="dz-text mb-3">Select files to send to this computer</p>
      <form method="post" action="/upload" enctype="multipart/form-data"
            class="d-flex flex-column align-items-center gap-2">
        <input class="form-control form-control-sm" style="max-width:320px"
               type="file" name="files" multiple required>
        <button class="btn btn-sm btn-primary" type="submit">Send files</button>
      </form>
    </div>
  </div>

  <section class="mt-4">
    <h2 class="fs-6 fw-semibold text-body-secondary text-uppercase mb-2">
      Files ({{count}})
    </h2>
    <div class="table-responsive">
      <table class="table table-hover align-middle filetable mb-0">
        <thead>
          <tr>
            <th class="col-icon"></th>
            <th>Name</th>
            <th class="col-size">Size</th>
            <th class="col-date">Date modified</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="fileRows"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty text-secondary text-center d-none">
      No files on this computer yet.
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/lanshare.js"></script>
</body>
</html>
