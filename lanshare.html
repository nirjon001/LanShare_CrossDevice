<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN Share</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<main id="loginView" {{login_hidden}} class="container py-5">
  <div class="card login-card">
    <div class="card-body text-center p-4">
      <div class="dz-icon mb-2">&#128274;</div>
      <h1 class="fs-4 fw-bold mb-1">LAN Share</h1>
      <p class="text-secondary small mb-4">
        This computer is PIN protected.<br>
        Enter the 4-digit PIN shown in the server terminal.
      </p>
      <form method="post" action="/login" class="d-flex justify-content-center gap-2">
        <input name="pin" class="form-control form-control-sm pin-input" type="text"
               maxlength="4" inputmode="numeric" pattern="[0-9]*"
               autocomplete="off" placeholder="PIN" required>
        <button class="btn btn-sm btn-primary" type="submit">Enter</button>
      </form>
      {{error_msg}}
    </div>
  </div>
</main>

<div id="appView" {{app_hidden}}>
  <nav class="navbar topbar">
    <div class="container-fluid px-4">
      <span class="navbar-brand fw-bold">LAN Share</span>
      <span class="badge text-bg-info" id="lanIp">{{lan_ip}}</span>
      <span class="ms-auto small text-secondary" id="fileCount"></span>
    </div>
  </nav>

  <main class="container py-4">

    <div id="dropzone" class="dropzone card" role="button" tabindex="0">
      <div class="card-body text-center py-4">
        <div class="dz-icon">&#128194;</div>
        <p class="dz-text mb-0">Drag files here or click to send to this computer</p>
      </div>
      <input type="file" id="fileInput" multiple hidden>
    </div>

    <section class="mt-4">
      <h2 class="fs-6 fw-semibold text-body-secondary text-uppercase mb-2">
        Files ({{count}})
      </h2>
      <div class="table-responsive">
        <table class="table table-hover align-middle filetable mb-0">
          <thead>
            <tr>
              <th class="col-icon"></th>
              <th>Name</th>
              <th class="col-size">Size</th>
              <th class="col-date">Date modified</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody id="fileRows"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty text-secondary text-center d-none">
        No files on this computer yet.
      </div>
    </section>

    <section class="mt-4 transfer-panel">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="fs-6 fw-semibold text-body-secondary text-uppercase mb-0">Transfers</h2>
        <button id="clearTransfers" class="btn btn-sm btn-link text-secondary text-decoration-none">
          Clear
        </button>
      </div>
      <div id="transferList">
        <div id="transferEmpty" class="text-secondary text-center py-2 small">
          No transfers yet.
        </div>
      </div>
    </section>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/lanshare.js"></script>
</body>
</html>
